<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Test - BlindType Text Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        
        .result h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }
        
        .text-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        
        .error {
            background: #fee;
            border-left-color: #e74c3c;
            color: #c0392b;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
        }
        
        .stat {
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #667eea;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Gemini Text Generator Test</h1>
        <p class="subtitle">Test Gemini API untuk generate teks latihan BlindType</p>
        
        <div class="input-group">
            <label for="apiKey">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="Paste your Gemini API key here..." value="">
        </div>
        
        <div class="row">
            <div class="input-group">
                <label for="language">Bahasa</label>
                <select id="language">
                    <option value="id">Bahasa Indonesia</option>
                    <option value="en">English</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                    <option value="code">Code</option>
                </select>
            </div>
        </div>
        
        <div class="input-group">
            <label for="count">Jumlah Teks</label>
            <input type="number" id="count" value="5" min="1" max="10">
        </div>
        
        <button id="generateBtn" onclick="generateTexts()">
            🚀 Generate Texts
        </button>
        
        <div id="result"></div>
    </div>
    
    <script>
        // Auto-load API key from localStorage
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
        
        async function generateTexts() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const language = document.getElementById('language').value;
            const difficulty = document.getElementById('difficulty').value;
            const count = parseInt(document.getElementById('count').value);
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('generateBtn');
            
            if (!apiKey) {
                resultDiv.innerHTML = '<div class="result error"><h3>❌ Error</h3><p>Please enter your Gemini API key!</p></div>';
                return;
            }
            
            // Save API key
            localStorage.setItem('gemini_api_key', apiKey);
            
            // Show loading
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Generating...';
            resultDiv.innerHTML = '<div class="result"><h3>⏳ Generating texts...</h3><p>Please wait while Gemini AI creates your practice texts.</p></div>';
            
            const startTime = Date.now();
            
            try {
                const prompt = getPrompt(language, difficulty, count);
                
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [
                                {
                                    parts: [
                                        {
                                            text: prompt,
                                        },
                                    ],
                                },
                            ],
                            generationConfig: {
                                temperature: 0.9,
                                topK: 40,
                                topP: 0.95,
                                maxOutputTokens: 2048,
                            },
                        }),
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                const generatedText = data.candidates[0]?.content?.parts[0]?.text || '';
                
                const texts = generatedText
                    .split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .filter(line => !line.match(/^[\d\.\-\*\#]+[\s\.\)]/));
                
                const timeElapsed = ((Date.now() - startTime) / 1000).toFixed(2);
                
                // Display results
                let html = '<div class="result">';
                html += '<h3>✅ Generation Successful!</h3>';
                
                texts.forEach((text, index) => {
                    html += `<div class="text-item">${index + 1}. ${escapeHtml(text)}</div>`;
                });
                
                html += '<div class="stats">';
                html += `<div class="stat"><div class="stat-label">Generated</div><div class="stat-value">${texts.length}</div></div>`;
                html += `<div class="stat"><div class="stat-label">Time</div><div class="stat-value">${timeElapsed}s</div></div>`;
                html += `<div class="stat"><div class="stat-label">Avg Length</div><div class="stat-value">${Math.round(texts.reduce((sum, t) => sum + t.length, 0) / texts.length)}</div></div>`;
                html += '</div>';
                html += '</div>';
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error"><h3>❌ Error</h3><p>${escapeHtml(error.message)}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Generate Texts';
            }
        }
        
        function getPrompt(language, difficulty, count) {
            const lang = language === 'id' ? 'Bahasa Indonesia' : 'English';
            
            const prompts = {
                easy: `Generate ${count} typing practice sentences in ${lang} for EASY level.
Requirements:
- Use common, everyday words
- Sentence length: 8-15 words
- Focus on basic vocabulary and simple sentence structures
- Use academic and professional tone
- Avoid complex punctuation
- Each sentence should teach touch typing fundamentals
- Topics: work habits, learning, focus, discipline, daily routines

Format: Return only the sentences, one per line, no numbering or bullet points.`,

                medium: `Generate ${count} typing practice sentences in ${lang} for MEDIUM level.
Requirements:
- Sentence length: 15-25 words
- Use more complex vocabulary and compound sentences
- Include academic and professional terminology
- Use proper punctuation (commas, semicolons, periods)
- Topics: productivity, technology, skill development, professional growth, cognitive processes
- Maintain formal academic tone

Format: Return only the sentences, one per line, no numbering or bullet points.`,

                hard: `Generate ${count} typing practice sentences in ${lang} for HARD level.
Requirements:
- Sentence length: 20-35 words
- Include numbers, dates, percentages, and special characters
- Use technical terminology and complex sentence structures
- Include abbreviations, acronyms, and professional jargon
- Mix letters, numbers, and symbols (%, &, @, #, -, etc.)
- Topics: technical specifications, research findings, statistical data, historical facts
- Maintain academic and formal tone

Format: Return only the sentences, one per line, no numbering or bullet points.`,

                code: `Generate ${count} code snippets for typing practice.
Requirements:
- Mix of JavaScript, TypeScript, PHP, and Laravel code
- Include common patterns: functions, classes, interfaces, constants
- Length: 60-120 characters per line
- Use modern syntax (ES6+, TypeScript types, Laravel 10+)
- Include realistic code: API calls, state management, validation, database queries
- Proper indentation and formatting
- Mix of frontend (React/TS) and backend (Laravel/PHP) code

Examples of what to include:
- TypeScript: interfaces, type definitions, React hooks, async/await, fetch calls
- JavaScript: arrow functions, destructuring, array methods, template literals
- PHP/Laravel: Eloquent queries, route definitions, controllers, validation rules

Format: Return only the code lines, one per line, no explanations or comments.`,
            };
            
            return prompts[difficulty];
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
